# Release: when package.json's version changes on main, tag vX.Y.Z and publish a GitHub Release
# with both bundles, then publish to the registries that are set up:
#   webdata-tools-mcp-X.Y.Z.mcpb           - MCP Bundle (Claude Desktop one-click install)
#   webdata-tools-mcp-X.Y.Z.smithery.mcpb  - same files, manifest with per-tool input schemas
# A version that already has a tag is not released again. To (re)publish an existing version,
# run the workflow by hand ("Run workflow") with "republish" ticked.
#
# Publishing (see PUBLISHING.md):
#   npm          - repo VARIABLE PUBLISH_NPM=true + npm Trusted Publishing set up on npmjs.com (OIDC).
#   MCP Registry - repo VARIABLE PUBLISH_MCP_REGISTRY=true (GitHub OIDC, nothing else to set up).
# Smithery stopped accepting server updates in October 2026 (its CLI, API and keys shut down on
# Oct 31), so there is no Smithery job; the existing listing stays in its directory.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      republish:
        description: Publish the current version to npm / MCP Registry even if it is already released
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: version
        name: Read version; skip the release if already tagged
        env:
          REPUBLISH: ${{ inputs.republish }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "created=false" >> "$GITHUB_OUTPUT"
            if [ "$REPUBLISH" = "true" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.created == 'true'
        run: npm ci
      - if: steps.version.outputs.created == 'true'
        run: npm test
      - if: steps.version.outputs.created == 'true'
        name: Build both bundles
        run: npm run build:mcpb
      - if: steps.version.outputs.created == 'true'
        name: manifest.json must be committed as generated
        run: git diff --exit-code manifest.json || (echo "::error::manifest.json is stale. Run 'npm run build:mcpb' and commit it." && exit 1)
      - if: steps.version.outputs.created == 'true'
        name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/webdata-tools-mcp-$VERSION.mcpb" \
            "dist/webdata-tools-mcp-$VERSION.smithery.mcpb" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  npm:
    needs: release
    if: needs.release.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --provenance --access public

  mcp-registry:
    needs: [release, npm]
    # After npm (the registry checks the npm package exists), or alone when npm publishing is off.
    if: always() && needs.release.outputs.publish == 'true' && vars.PUBLISH_MCP_REGISTRY == 'true' && needs.npm.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]'); ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

